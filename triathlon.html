<link rel="stylesheet" href="styles/main.css" />
<link rel="stylesheet" href="styles/gallery.css" />
<style>
  .rec-grid-wide { grid-template-columns: repeat(2, 1fr); }
  .rec.wide { grid-template-columns: 150px 1fr; }
  .rec.wide .rec-route { width: 150px; height: 150px; display:block; padding: 14px 12px; }
  .legs { display:grid; gap: 7px; }
  .leg { display:grid; grid-template-columns: 34px 1fr; align-items:center; gap: 6px; font-size:.62rem; color: rgba(255,255,255,.55); letter-spacing:.04em; }
  .leg i { display:block; height: 9px; border-radius: 3px; background: rgba(255,255,255,.22); }
  .leg.mine { color:#58d995; } .leg.mine i { background:#58d995; }
  .leg.t i { height: 4px; background: rgba(255,255,255,.12); }
  .rec-stats { display:flex; gap: 12px; font-size:.78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-wrap:wrap; }
  .rec-stats b { color: var(--ink); font-weight: 700; }
  .rec-sub { font-size:.76rem; color: var(--ink-soft); }
  .rec-time small { font-size:.72rem; color: var(--ink-soft); letter-spacing:0; margin-left: 6px; font-family: inherit; }
  @media (max-width: 1000px) { .rec-grid-wide { grid-template-columns: 1fr; } }
  @media (max-width: 780px) { .rec.wide { grid-template-columns: 110px 1fr; } .rec.wide .rec-route { width: 110px; height: 110px; padding: 10px 8px; } }
</style>
</head>

      <p class="intro">接力赛按棒次记录，绿色是我跑的那一棒。</p>
    </div>
